name: Build Daemon PKI Linux Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release server
        run: cargo build --release -p daemon-pki-api --bin server

      - name: Prepare deployment package
        run: |
          mkdir -p release/daemon-pki

          cp target/release/server \
            release/daemon-pki/daemon-pki-server

          cp deploy/install.sh \
            release/daemon-pki/install.sh

          cp deploy/systemd/daemon-pki.service \
            release/daemon-pki/daemon-pki.service

          chmod 0755 \
            release/daemon-pki/daemon-pki-server \
            release/daemon-pki/install.sh

          tar -czf daemon-pki-linux-x86_64.tar.gz \
            -C release daemon-pki

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: daemon-pki-linux-x86_64
          path: daemon-pki-linux-x86_64.tar.gz
