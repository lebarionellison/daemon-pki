[workspace]
resolver = "2"
members = [
    "daemon-pki-core",
    "daemon-pki-api",
    "daemon-pki-cli",
    "daemon-pki-agent"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = "0.10"

rcgen = { version = "0.14.10", features = ["pem", "zeroize"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
rustls = "0.23.45"

